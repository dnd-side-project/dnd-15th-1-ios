# Dulpick SwiftLint draft
# 기준: StyleShare 계열 가이드 + 현재 레포(SwiftUI/TCA)

disabled_rules:
  # 포맷터가 없어 노이즈만 커지는 룰
  - trailing_whitespace
  - todo
  - multiple_closures_with_trailing_closure
  - trailing_comma
  - file_length
  # 포맷터 없이 과도한 스타일 강제 완화
  - opening_brace
  - statement_position

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - closure_spacing
  - unowned_variable_capture
  - private_over_fileprivate
  - empty_enum_arguments
  - weak_delegate
  - first_where
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - overridden_super_call
  - toggle_bool
  - closure_body_length
  - sorted_imports
  - vertical_whitespace_closing_braces
  - modifier_order
  - redundant_nil_coalescing
  - unused_import

# 안전성
force_unwrapping: error
implicitly_unwrapped_optional: error
force_cast: warning
force_try: warning

# 가이드 정합: 한 줄은 짧게 유지
# 팀 합의: warning 120 / error 140
line_length:
  warning: 120
  error: 140
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 90
  error: 120

type_body_length:
  warning: 250
  error: 350

file_length:
  warning: 400
  error: 600

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - on
    - to
    - at
    - vc

nesting:
  type_level:
    warning: 2
    error: 3

cyclomatic_complexity:
  warning: 12
  error: 20

# 프로젝트 생성물/외부 영역 제외
excluded:
  - Tuist
  - .build
  - Derived
  - DerivedData
  - .git
  - Dulpick.xcworkspace
  - "**/*.xcodeproj"
