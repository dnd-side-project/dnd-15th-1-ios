name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel overlapping PR runs; keep push runs on main/dev.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: ~/.cache/tuist
          key: tuist-${{ runner.os }}-${{ hashFiles('.mise.toml', 'Tuist.swift', 'Workspace.swift', 'Tuist/Package.swift', 'Projects/**/Project.swift', 'Tuist/ProjectDescriptionHelpers/**') }}
          restore-keys: |
            tuist-${{ runner.os }}-

      - name: Prepare local config
        run: |
          cp Config/Example.xcconfig Config/Debug.xcconfig
          cp Config/Example.xcconfig Config/Release.xcconfig
          cp Config/GoogleService-Info-Example.plist Config/GoogleService-Info-Debug.plist
          cp Config/GoogleService-Info-Example.plist Config/GoogleService-Info-Release.plist

      - name: Generate project
        run: mise exec -- tuist generate --no-open

      - name: SwiftLint
        run: mise exec -- swiftlint lint --strict

      - name: Select simulator
        run: |
          DESTINATION="$(
            python3 -c '
          import re
          import subprocess

          output = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available"],
              text=True,
          )
          for line in output.splitlines():
              match = re.search(r"iPhone.+?\(([A-F0-9-]{36})\)", line)
              if match:
                  print(f"platform=iOS Simulator,id={match.group(1)}")
                  break
          else:
              raise SystemExit("No available iPhone simulator found")
          '
          )"
          echo "Using destination: $DESTINATION"
          echo "DESTINATION=$DESTINATION" >> "$GITHUB_ENV"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .derivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build
        run: |
          xcodebuild \
            -workspace Dulpick.xcworkspace \
            -scheme Dulpick-Debug \
            -destination "$DESTINATION" \
            -derivedDataPath .derivedData \
            -skipMacroValidation \
            build

      - name: Test Feature Reducers
        run: |
          xcodebuild \
            -workspace Dulpick.xcworkspace \
            -scheme Feature \
            -destination "$DESTINATION" \
            -derivedDataPath .derivedData \
            -skipMacroValidation \
            test
