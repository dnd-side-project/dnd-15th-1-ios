name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Cancel overlapping PR runs; keep push runs on main/dev.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TUIST_CI_WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Prepare local config
        run: |
          cp Config/Example.xcconfig Config/Debug.xcconfig
          cp Config/Example.xcconfig Config/Release.xcconfig
          cp Config/GoogleService-Info-Example.plist Config/GoogleService-Info-Debug.plist
          cp Config/GoogleService-Info-Example.plist Config/GoogleService-Info-Release.plist

      # build 잡이 만든 캐시를 읽기만 한다. 린트는 빌드 산출물을 만들지 않아 따로 저장할 것이 없고,
      # 잡마다 저장하면 항목이 셋이 되어 저장소 한도 10GB 를 밀어낸다.
      - name: Restore derived data
        uses: actions/cache/restore@v4
        with:
          path: .derivedData
          key: dd-build-${{ runner.os }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}-${{ github.sha }}
          restore-keys: |
            dd-build-${{ runner.os }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}-
            dd-build-${{ runner.os }}-

      - name: Generate project
        run: mise exec -- tuist generate --no-open

      - name: SwiftLint
        run: mise exec -- swiftlint lint --strict

  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TUIST_CI_WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Prepare local config
        run: |
          cp Config/Example.xcconfig Config/Debug.xcconfig
          cp Config/Example.xcconfig Config/Release.xcconfig
          cp Config/GoogleService-Info-Example.plist Config/GoogleService-Info-Debug.plist
          cp Config/GoogleService-Info-Example.plist Config/GoogleService-Info-Release.plist

      - name: Restore derived data
        uses: actions/cache/restore@v4
        with:
          path: .derivedData
          key: dd-build-${{ runner.os }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}-${{ github.sha }}
          restore-keys: |
            dd-build-${{ runner.os }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}-
            dd-build-${{ runner.os }}-

      - name: Generate project
        run: mise exec -- tuist generate --no-open

      - name: Select simulator
        run: |
          DESTINATION="$(
            python3 -c '
          import re
          import subprocess

          output = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available"],
              text=True,
          )
          for line in output.splitlines():
              match = re.search(r"iPhone.+?\(([A-F0-9-]{36})\)", line)
              if match:
                  print(f"platform=iOS Simulator,id={match.group(1)}")
                  break
          else:
              raise SystemExit("No available iPhone simulator found")
          '
          )"
          echo "Using destination: $DESTINATION"
          echo "DESTINATION=$DESTINATION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          xcodebuild \
            -workspace Dulpick.xcworkspace \
            -scheme Dulpick-Debug \
            -destination "$DESTINATION" \
            -derivedDataPath .derivedData \
            -skipMacroValidation \
            build

      # path 에 폴더 이름만 적으면 actions/cache 가 그 아래 파일을 후보로 올리지 않아
      # `!` 제외 줄이 뺄 대상을 못 찾는다 (actions/toolkit#713). 그래서 저장 전에 지운다.
      # 둘 다 다시 만들어지는 폴더다.
      - name: Trim derived data before caching
        run: rm -rf .derivedData/Logs .derivedData/Index.noindex

      - name: Save derived data
        uses: actions/cache/save@v4
        with:
          path: .derivedData
          key: dd-build-${{ runner.os }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}-${{ github.sha }}

  test:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TUIST_CI_WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Prepare local config
        run: |
          cp Config/Example.xcconfig Config/Debug.xcconfig
          cp Config/Example.xcconfig Config/Release.xcconfig
          cp Config/GoogleService-Info-Example.plist Config/GoogleService-Info-Debug.plist
          cp Config/GoogleService-Info-Example.plist Config/GoogleService-Info-Release.plist

      - name: Restore derived data
        uses: actions/cache/restore@v4
        with:
          path: .derivedData
          key: dd-test-${{ runner.os }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}-${{ github.sha }}
          restore-keys: |
            dd-test-${{ runner.os }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}-
            dd-test-${{ runner.os }}-

      - name: Generate project
        run: mise exec -- tuist generate --no-open

      - name: Select simulator
        run: |
          DESTINATION="$(
            python3 -c '
          import re
          import subprocess

          output = subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available"],
              text=True,
          )
          for line in output.splitlines():
              match = re.search(r"iPhone.+?\(([A-F0-9-]{36})\)", line)
              if match:
                  print(f"platform=iOS Simulator,id={match.group(1)}")
                  break
          else:
              raise SystemExit("No available iPhone simulator found")
          '
          )"
          echo "Using destination: $DESTINATION"
          echo "DESTINATION=$DESTINATION" >> "$GITHUB_ENV"

      - name: Test Feature Reducers
        run: |
          xcodebuild \
            -workspace Dulpick.xcworkspace \
            -scheme Feature \
            -destination "$DESTINATION" \
            -derivedDataPath .derivedData \
            -skipMacroValidation \
            test

      # path 에 폴더 이름만 적으면 actions/cache 가 그 아래 파일을 후보로 올리지 않아
      # `!` 제외 줄이 뺄 대상을 못 찾는다 (actions/toolkit#713). 그래서 저장 전에 지운다.
      # 둘 다 다시 만들어지는 폴더다.
      - name: Trim derived data before caching
        run: rm -rf .derivedData/Logs .derivedData/Index.noindex

      - name: Save derived data
        uses: actions/cache/save@v4
        with:
          path: .derivedData
          key: dd-test-${{ runner.os }}-${{ hashFiles('.package.resolved', 'Projects/**/Project.swift') }}-${{ github.sha }}
